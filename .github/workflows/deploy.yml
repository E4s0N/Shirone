name: Deploy Shirone Blog

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-update] # 响应内容仓库发送的派发事件
  workflow_dispatch:

# 发布到 gh-pages 分支需要 GITHUB_TOKEN 具备写权限；未声明 permissions 时
# 默认只读，推送会被 403 拒绝（denied to github-actions[bot]）
permissions:
  contents: write

# 连续触发时只保留最新一次构建：旧构建被取消，避免交叉推送 gh-pages
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Record build start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout Theme Repo
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 构建链中的 subset-fonts.mjs / check-fonts.mjs 直接 import .ts 配置
          # （src/config/fontConfig.ts），需要 Node 22.18+ 默认开启的 type
          # stripping；Node 20 会报 ERR_UNKNOWN_FILE_EXTENSION。
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Private Content & Build
        id: build
        env:
          CONTENT_REPO_URL: "https://x-access-token:${{ secrets.SHIRONECONTENTSYNC }}@github.com/${{ github.repository_owner }}/Shirone-Content.git"
        run: |
          pnpm content:sync
          pnpm build

      - name: Deploy to GitHub Pages
        id: publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # 构建与发布结果通过企业微信通知（优先群机器人 webhook，无 IP 限制；
      # 自建应用 API 受可信 IP 白名单限制，GitHub 托管 runner 的动态 IP 无法
      # 加入白名单，会报 errcode=60020）
      - name: Notify result via WeCom
        if: always()
        continue-on-error: true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_SECRET: ${{ secrets.WECOM_SECRET }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
          SITE_URL: ${{ vars.SITE_URL }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          commit_subject="$(git log -1 --format=%s)"
          duration=$(( $(date +%s) - BUILD_START ))
          case "$EVENT_NAME" in
            push) trigger="主题仓推送";;
            repository_dispatch) trigger="内容仓更新${PAYLOAD_REPOSITORY:+（${PAYLOAD_REPOSITORY}@${PAYLOAD_SHA:0:7}）}";;
            *) trigger="手动触发";;
          esac
          header_common="> 仓库：${{ github.repository }}
          > 提交：$short_sha $commit_subject
          > 触发方式：$trigger，耗时 ${duration} 秒
          > [查看工作流日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ -n "$SITE_URL" ]; then
            header_common="$header_common
          > [访问站点]($SITE_URL)"
          fi
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$PUBLISH_OUTCOME" = "success" ]; then
            printf '## ✅ 博客部署成功\n%s\n> gh-pages 已更新，EdgeOne 将自动同步最新内容\n' "$header_common" > wecom-message.md
          else
            failed=""
            [ "$BUILD_OUTCOME" != "success" ] && failed="构建（内容同步 + astro build）"
            if [ "$PUBLISH_OUTCOME" != "success" ]; then
              failed="${failed:+$failed、}发布到 gh-pages"
            fi
            printf '## ❌ 博客部署失败\n%s\n> 失败阶段：%s\n' "$header_common" "$failed" > wecom-message.md
          fi
          cat wecom-message.md
          node scripts/notify/wecom.mjs wecom-message.md
