name: Deploy Shirone Blog

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-update] # 响应内容仓库发送的派发事件
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Theme Repo
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 构建链中的 subset-fonts.mjs / check-fonts.mjs 直接 import .ts 配置
          # （src/config/fontConfig.ts），需要 Node 22.18+ 默认开启的 type
          # stripping；Node 20 会报 ERR_UNKNOWN_FILE_EXTENSION。
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Private Content & Build
        env:
          CONTENT_REPO_URL: "https://x-access-token:${{ secrets.SHIRONECONTENTSYNC }}@github.com/${{ github.repository_owner }}/Shirone-Content.git"
        run: |
          pnpm content:sync
          pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
