name: Deploy to EdgeOne

# EdgeOne 部署触发与通知的职责划分：
# - 主题仓 push 的自动构建由 EdgeOne 的 Git 集成完成（这里不要加 push 触发再调
#   hook，否则主题仓每次提交都会重复触发两次部署）；
# - 内容仓变更 EdgeOne 的 Git 监听感知不到，通过 repository_dispatch 到这里，
#   再调用 Deploy Hook 触发部署；
# - 真实的构建结果通知由 EdgeOne 构建环境内的 scripts/deploy/edgeone-build.mjs
#   包装器推送（成功摘要 / 失败错误摘录），本 workflow 仅在 hook 调用失败时
#   发送失败通知（此时部署根本没有开始，包装器不会运行）。
#
# 所需 secrets：
#   EDGEONE_DEPLOY_HOOK  EdgeOne Pages 的 Deploy Hook URL
#   WECOM_CORP_ID / WECOM_AGENT_ID / WECOM_SECRET  企业微信自建应用凭据
#   WECOM_TOUSER  可选：指定接收人

on:
  repository_dispatch:
    types: [content-update, edgeone-deploy]
  workflow_dispatch:

# 同一时间只允许一条部署指令在途，新触发自动取消排队中的旧触发
concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger EdgeOne deploy and notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect deploy context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          commit_subject="$(git log -1 --format=%s)"
          trigger="workflow_dispatch"
          if [ "$EVENT_NAME" = "push" ]; then
            trigger="push to main"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            trigger="内容仓推送 ${PAYLOAD_REPOSITORY:-unknown}@${PAYLOAD_SHA:0:7}${PAYLOAD_SOURCE:+（$PAYLOAD_SOURCE）}"
          fi
          {
            echo "short_sha=$short_sha"
            echo "commit_subject=$commit_subject"
            echo "trigger=$trigger"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_OUTPUT"

      - name: Trigger EdgeOne deploy hook
        id: hook
        env:
          EDGEONE_DEPLOY_HOOK: ${{ secrets.EDGEONE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          curl_rc=0
          http_code=$(curl -sS -o hook-response.json -w '%{http_code}' \
            --max-time 60 --request POST "$EDGEONE_DEPLOY_HOOK" 2> hook-error.log) || curl_rc=$?
          finished_at=$(date +%s)
          {
            echo "duration=$(( finished_at - started_at ))"
            echo "http_code=${http_code:-0}"
            echo "curl_rc=$curl_rc"
          } >> "$GITHUB_OUTPUT"
          if [ "$curl_rc" -ne 0 ] || [[ ! "${http_code:-}" =~ ^2 ]]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            cat hook-error.log >&2 || true
            exit 1
          fi
          echo "result=success" >> "$GITHUB_OUTPUT"
          cat hook-response.json

      # hook 调用失败说明部署根本没有开始，EdgeOne 构建环境内的包装器不会运行，
      # 此时由这里兜底发送失败通知；hook 成功时构建结果通知由包装器负责
      - name: Build failure notification message
        if: failure()
        env:
          HTTP_CODE: ${{ steps.hook.outputs.http_code }}
          CURL_RC: ${{ steps.hook.outputs.curl_rc }}
          DURATION: ${{ steps.hook.outputs.duration }}
          TRIGGER: ${{ steps.context.outputs.trigger }}
          SHORT_SHA: ${{ steps.context.outputs.short_sha }}
          COMMIT_SUBJECT: ${{ steps.context.outputs.commit_subject }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ steps.context.outputs.run_url }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "## ❌ EdgeOne 部署触发失败"
            printf '%s\n' "> 仓库：$REPO"
            printf '%s\n' "> 触发方式：$TRIGGER"
            printf '%s\n' "> 提交：$SHORT_SHA $COMMIT_SUBJECT"
            printf '%s\n' "> HTTP 状态：${HTTP_CODE:-无响应}（curl 退出码 $CURL_RC），耗时 ${DURATION} 秒"
            printf '%s\n' "> [查看工作流日志]($RUN_URL)"
            printf '%s\n' ""
            printf '%s\n' '```'
            head -c 600 hook-response.json 2>/dev/null || true
            printf '%s\n' ""
            head -c 300 hook-error.log 2>/dev/null || true
            printf '%s\n' ""
            printf '%s\n' '```'
          } > wecom-message.md
          cat wecom-message.md

      - name: Send WeCom notification
        if: failure()
        continue-on-error: true
        env:
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_SECRET: ${{ secrets.WECOM_SECRET }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
        run: node scripts/notify/wecom.mjs wecom-message.md

      - name: Summarize
        if: always()
        env:
          TRIGGER: ${{ steps.context.outputs.trigger }}
          SHORT_SHA: ${{ steps.context.outputs.short_sha }}
          COMMIT_SUBJECT: ${{ steps.context.outputs.commit_subject }}
          HTTP_CODE: ${{ steps.hook.outputs.http_code }}
          RESULT: ${{ steps.hook.outputs.result }}
        run: |
          set -euo pipefail
          {
            echo "### EdgeOne deploy"
            echo ""
            echo "- Trigger: $TRIGGER"
            echo "- Commit: \`$SHORT_SHA\` $COMMIT_SUBJECT"
            echo "- Hook: HTTP \`${HTTP_CODE:-n/a}\`, result \`${RESULT:-skipped}\`"
          } >> "$GITHUB_STEP_SUMMARY"
